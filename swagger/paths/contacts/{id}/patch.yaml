tags:
  - Contacts
summary: Patch contact by id
operationId: updateContact
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    description: ID of the contact to be updated
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../../components/schemas/contact/ContactUpdate.yaml'
responses:
  '200':
    description: 'Successfully patched contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact/Contact.yaml'
  '401':
    $ref: '../../../components/responses/contact/401.yaml'
  '404':
    $ref: '../../../components/responses/contact/404.yaml'
