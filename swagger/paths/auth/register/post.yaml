tags:
  - Auth
summary: User Registration
operationId: RegisterUser
description: 'User Registration'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
        properties:
          name:
            description: 'name'
            type: string
            example: 'John Doe'
          email:
            description: 'email'
            type: string
            example: 'example@mail.com'
responses:
  '201':
    description: Successfully registered a user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              properties:
                name:
                  type: string
                  example: 'John Doe'
                email:
                  type: string
                  example: 'example@mail.com'
                password:
                  type: string
                  example: 'password123'
  '409':
    $ref: '../../../components/responses/auth/409.yaml'
