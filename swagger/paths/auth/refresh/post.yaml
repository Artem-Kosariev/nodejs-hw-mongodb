tags:
  - Auth
summary: Refresh session
operationId: refreshUserSesion
description: 'Refresh User session'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: 'email'
            type: string
            example: 'example@mail.com'
          password:
            description: 'Refresh contacts password'
            type: string
            example: pasword123
responses:
  '200':
    description: Refresh session
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refresh session!
            data:
              type: object
              $ref: '../../../components/schemas/auth/login.yaml'
  '401':
    $ref: '../../../components/responses/auth/401.yaml'
