tags:
  - Auth
summary: User Login
operationId: loginUser
description: Login User
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
          password:
            type: string
responses:
  '200':
    description: Login User
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in!
            data:
              type: object
              $ref: '../../../components/schemas/auth/login.yaml'
  '401':
    $ref: '../../../components/responses/auth/401.yaml'
